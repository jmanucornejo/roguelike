[package]
name = "roguelike"
version = "0.1.0"
edition = "2021"
default-run = "client"
autobins = false

[[bin]]
name = "client"
path = "src/bin/client.rs"
required-features = ["client"]

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["server"]

[features]
default = ["client", "server"]
client = [
    "bevy/default",
    "bevy/pbr_clustered_decals",
    "bevy_rapier3d/debug-render-3d",
    "dep:bevy-inspector-egui",
    "dep:bevy_asset_loader",
    "dep:bevy_egui",
    "dep:bevy_obj",
    "dep:bevy_panorbit_camera",
    "dep:bevy_sprite3d",
    "dep:ureq",
]
server = [
    "bevy/async_executor",
    "bevy/bevy_asset",
    "bevy/bevy_gltf",
    "bevy/bevy_image",
    "bevy/bevy_log",
    "bevy/bevy_mesh",
    "bevy/bevy_scene",
    "bevy/bevy_state",
    "bevy/bevy_world_serialization",
    "bevy/multi_threaded",
    "bevy/png",
    "bevy/reflect_auto_register",
    "bevy/std",
    "dep:argon2",
    "dep:kd-tree",
    "dep:pathfinding",
    "dep:sqlx",
    "dep:tokio",
]
dev_dynamic_linking = ["bevy/dynamic_linking"]
client_prediction = []
batched_position_snapshots = []

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[dependencies]
argon2 = { version = "0.5.3", optional = true }
bevy = { version = "=0.19.0", default-features = false }
bevy-inspector-egui = { version = "=0.37.0", optional = true }
bevy_asset_loader = { version = "=0.27.0", features = ["2d"], optional = true }
bevy_egui = { version = "=0.40.1", optional = true }
bevy_obj = { version = "=0.19.0", optional = true }
bevy_panorbit_camera = { version = "=0.35.0", optional = true }
bevy_platform = "=0.19.0"
bevy_rapier3d = { version = "=0.35.0", default-features = false, features = ["dim3", "async-collider", "headless", "to-bevy-mesh"] }
bevy_renet = "=5.0.0"
bevy_sprite3d = { version = "=9.0.0", optional = true }
bincode = "1.3.3"
dotenvy = "0.15.7"
fastrand = "2.1.0"
kd-tree = { version = "=0.6.0", features = ["rayon"], optional = true }
pathfinding = { version = "4.10.0", optional = true }
rand = "0.8.5"
serde = { version = "1.0.204", features = ["derive"] }
sqlx = { version = "0.8.6", default-features = false, features = ["macros", "migrate", "mysql", "runtime-tokio"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync"], optional = true }
typenum = "=1.18.0"
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
