[package]
name = "roguelike"
version = "0.1.0"
edition = "2021"
default-run = "client"
autobins = false

[[bin]]
name = "client"
path = "src/bin/client.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[features]
default = []
client_prediction = []

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[dependencies]
bevy = { version = "=0.19.0", features = ["dynamic_linking", "bevy_state", "pbr_clustered_decals"] }
bevy-inspector-egui = "=0.37.0"
bevy_asset_loader = { version = "=0.27.0", features = ["2d"] }
bevy_egui = "=0.40.1"
bevy_flycam = "=0.19.0"
bevy_obj = "=0.19.0"
bevy_panorbit_camera = "=0.35.0"
bevy_platform = "=0.19.0"
bevy_rapier3d = "=0.35.0"
bevy_renet = "=5.0.0"
bevy_sprite3d = "=9.0.0"
bincode = "1.3.3"
fastrand = "2.1.0"
kd-tree = { version = "=0.6.0", features = ["rayon"] }
local-ip-address = "0.6.1"
pathfinding = "4.10.0"
rand = "0.8.5"
renet_visualizer = "=3.0.0"
serde = { version = "1.0.204", features = ["derive"] }
typenum = "=1.18.0"
